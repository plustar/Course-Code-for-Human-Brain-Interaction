# 感知节点的参数（perception.launch.py 与 system.launch.py 默认加载本文件）
# 改参数的三种方式，任选其一：
#   1) 启动时覆盖：ros2 launch hci_bringup perception.launch.py model:=/绝对路径/best.onnx
#   2) 复制本文件改好，启动时加 perception_params:=/绝对路径/my_perception.yaml（不用重新编译）
#   3) 直接改本文件：用 colcon build --symlink-install 编译过的话，保存后重新启动即可生效
# 每个参数的含义：见 README 的参数表，或运行 ros2 param describe /hci/recognizer_node model
/**/camera_node:
  ros__parameters:
    source: "0"               # "0" 即 /dev/video0；也可以写视频文件的绝对路径
    width: 640
    height: 480
    fps: 30.0                 # 视频文件按自身帧率播放
    fourcc: MJPG              # 摄像头像素格式；留空 "" 表示不设置
    loop_video: true
    hfov_deg: 60.0            # 摄像头的水平视场角，用来推出内参
    frame_id: camera
    publish_compressed: false

/**/recognizer_node:
  ros__parameters:
    model: ""                 # 练习 3 导出的模型，如 /home/<用户名>/hci-course-code/exercises/face_recognition/runs/me/weights/best.onnx
    gallery: ""               # 两步法：sface_verify.py enroll 生成的登记文件（.npy）
    identity: ""              # 两步法：比对成功时的类别名，如 stu_2023123456
    min_confidence: 0.5
    iou_threshold: 0.5
    imgsz: 416                # 与训练时一致
    max_rate: 15.0            # 推理频率上限（Hz）
    use_compressed: false
    image_reliability: reliable   # camera:=robot 时按平台自动选择（TurtleBot 4 的相机要用 best_effort）
    id_map: ["stu_2023123456=张三"]   # 改成自己的学号和姓名
    target_height: 0.22       # 人脸的实际高度（米）；改测学生证时填卡片高度
    hfov_deg: 60.0            # 没收到 camera_info 时按它估计内参

/**/viewer_node:
  ros__parameters:
    show_window: true
    use_compressed: false
    image_reliability: reliable
    slop: 0.2                 # 图像与检测结果配对时允许的时间差（秒）
    blur_others: true         # 给他人打码（Track A 的人脸；Track B 标志物可设 false）
    status_bar: true
    greeting_seconds: 5.0
    font_path: ""             # 留空自动查找中文字体
