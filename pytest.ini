[pytest]
# 整个仓库共用的 pytest 设置；colcon test 在各个 ROS 包里运行 pytest 时也会用到这里。
# 用法见 docs/TESTING.md；最常用的是 bash tools/run_tests.sh。

# 不带路径直接运行 pytest 时，收集这些目录（ROS 包的测试由 colcon test 逐包运行）
testpaths = tests exercises/ros_basics/tests exercises/face_recognition/tests

# 缺条件的测试会被跳过：-ra 在最后列出每一项跳过的原因
addopts = -ra --strict-markers

markers =
    ros: 需要 ROS 2 环境（rclpy 与消息包）
    launch: 启动真实的 ROS 进程（ros2 launch、ros2 run 或练习脚本），较慢
    slow: 单项运行超过 10 秒
    gui: 要弹出窗口；只有 bash tools/run_tests.sh --gui 才运行
    train: 需要训练环境（conda activate hci-train）
    linter: 静态检查（ament_flake8、ament_pep257、ament_mypy、ament_xmllint）

# 每项测试最多 60 秒（需要 pytest-timeout）；慢的系统测试在测试里单独放宽
timeout = 60
